name: ci

on:
  push: { branches: [main] }
  pull_request:

# Least privilege. `pull_request` runs PR-authored code (pip install -e, pytest),
# and actions/checkout persists its token in .git/config by default — so without
# these two lines that code can use the token against this repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; test it so the claim is real.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check .
      - run: mypy src/voxeval
